[project]
name = "biosignal"
version = "0.1.0"
description = "Track small biotech companies waiting for an FDA decision and collect public data about them."
requires-python = ">=3.12"
dependencies = [
    "yfinance>=1.8.0",
]

[project.scripts]
capture = "information_capturing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["information_capturing"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
